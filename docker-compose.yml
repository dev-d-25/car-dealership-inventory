services:
  postgres:
    image: postgres:17-alpine
    container_name: car-dealership-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: car_dealership
      POSTGRES_PASSWORD: car_dealership_dev
      POSTGRES_DB: car_dealership
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U car_dealership"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
